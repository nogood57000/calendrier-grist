<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      overflow: hidden;
    }

    #barre-legende {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;

      border-bottom: 1px solid #e2e8f0;

      color: #334155;
    }
    .item-legende {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pastille {

      display: inline-block;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
    .pastille-vacances {
      background: #bae6fd;
      border: 1px solid #38bdf8;
    }
    .pastille-we-ferie {

    }

    #calendar-container {
      flex: 1;

    /* MÊME COLORIS POUR LES WEEK-ENDS ET LES JOURS FÉRIÉS (MOSELLE) */
    .fc-day-sat,

      background-color: #f1f5f9 !important;
    }

    /* COLORIS VACANCES SCOLAIRES ZONE B */
    .cellule-vacances-zone-b {
      background-color: #f0f9ff !important;
    }

    /* Week-end / Férié en période de vacances */
    .cellule-vacances-zone-b.fc-day-sat,
    .cellule-vacances-zone-b.fc-day-sun,
    .cellule-vacances-zone-b.cellule-ferie-moselle {
      background-color: #e0f2fe !important;
    }

    .etiquette-ferie {
      font-size: 9px;
      font-weight: 700;
      color: #b91c1c;
      background: #fee2e2;
      padding: 1px 3px;
      border-radius: 2px;
      margin-left: 4px;
      display: inline-block;
    }

    .etiquette-vacances {
      font-size: 8px;
      font-weight: 600;
      color: #0369a1;
      background: #e0f2fe;
      padding: 1px 3px;
      border-radius: 2px;
      margin-left: 2px;
      display: inline-block;
    }

    /* BLOCS DES PRÉSENCES */
    .fc-event, 
    .fc-daygrid-event, 
    .fc-daygrid-block-event {
      white-space: normal !important;
      min-height: 38px !important;
      margin-bottom: 3px !important;
      border-radius: 4px !important;
      border: none !important;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    .fc-event-main {
      padding: 2px 5px !important;
      white-space: normal !important;
    }

    .event-card {

      flex-direction: column;
      gap: 2px;
      line-height: 1.2;
      text-align: left;
    }

    .event-ligne-statut {

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.25);
      padding: 1px 4px;
      border-radius: 2px;
      width: fit-content;

    .event-ligne-nom {
      font-size: 11px;
      font-weight: 600;

    }

    #fenetre-voeu {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10000;
      align-items: center;
      justify-content: center;

    .conteneur-formulaire {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }
    .conteneur-formulaire h3 {
      margin: 0 0 14px 0;

      color: #1e293b;
    }
    .champ {
      margin-bottom: 10px;
    }
    .champ label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #475569;
    }
    .champ input, .champ select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
      background: #ffffff;
    }
    .barre-boutons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
    }
    .groupe-actions-droite {
      display: flex;
      gap: 8px;
    }
    .btn {
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    .btn-gris {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-bleu {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-rouge {
      background: #fee2e2;
      color: #b91c1c;
    }
  </style>
</head>
<body>

    <span class="item-legende"><span class="pastille pastille-vacances"></span> Vacances Zone B</span>

  <div id="calendar-container">

  <div id="fenetre-voeu">
    <div class="conteneur-formulaire">
      <h3 id="titre-modal">Nouveau vœu de présence</h3>
      
      <div class="champ">
        <label for="form-agent">Membre de l'équipe</label>
        <select id="form-agent">
          <option value="">Chargement...</option>

      <div class="champ">
        <label for="form-statut">Statut</label>
        <select id="form-statut">
          <option value="CONGES">CONGES</option>

  <script>
    let calendar = null;
    const annuaireAgents = new Map();
    let memoireDerniersRecords = [];
    let ligneSelectionneeId = null;

    // 1. Périodes des vacances scolaires Zone B (Académie Nancy-Metz) 2026-2027
    const PLAGES_VACANCES_ZONE_B = [
      { debut: "2026-10-17", fin: "2026-11-01", nom: "Toussaint" },
      { debut: "2026-12-19", fin: "2027-01-03", nom: "Noël" },
      { debut: "2027-02-20", fin: "2027-03-07", nom: "Hiver" },
      { debut: "2027-04-17", fin: "2027-05-02", nom: "Printemps" },
      { debut: "2027-05-06", fin: "2027-05-09", nom: "Pont Ascension" },
      { debut: "2027-07-03", fin: "2027-09-01", nom: "Été" }
    ];

    function estJourVacances(dateStr) {
      for (const p of PLAGES_VACANCES_ZONE_B) {
        if (dateStr >= p.debut && dateStr <= p.fin) return p.nom;
      }
      return null;
    }

    // 2. Jours fériés officiels + spécifiques Alsace-Moselle (Vendredi Saint et Saint-Étienne)
    const DICT_FERIES_MOSELLE = {
      // 2026
      "2026-01-01": "Jour de l'An",
      "2026-04-03": "Vendredi Saint (Moselle)",
      "2026-04-06": "Lundi de Pâques",
      "2026-05-01": "Fête du Travail",
      "2026-05-08": "Victoire 1945",
      "2026-05-14": "Ascension",
      "2026-05-25": "Lundi de Pentecôte",
      "2026-07-14": "Fête Nationale",
      "2026-08-15": "Assomption",
      "2026-11-01": "Toussaint",
      "2026-11-11": "Armistice 1918",
      "2026-12-25": "Noël",
      "2026-12-26": "Saint-Étienne (Moselle)",
      // 2027
      "2027-01-01": "Jour de l'An",
      "2027-03-26": "Vendredi Saint (Moselle)",
      "2027-03-29": "Lundi de Pâques",
      "2027-05-01": "Fête du Travail",
      "2027-05-06": "Ascension",
      "2027-05-08": "Victoire 1945",
      "2027-05-17": "Lundi de Pentecôte",
      "2027-07-14": "Fête Nationale",
      "2027-08-15": "Assomption",
      "2027-11-01": "Toussaint",
      "2027-11-11": "Armistice 1918",
      "2027-12-25": "Noël",
      "2027-12-26": "Saint-Étienne (Moselle)"
    };

    const COULEURS = {
      'CONFLIT': '#d32f2f',
      'CONGES': '#fbc02d',
      'CONGÉS': '#fbc02d',
      'TELETRAVAIL': '#1976d2',
      'TÉLÉTRAVAIL': '#1976d2',
      'EN DEPLACEMENT': '#f57c00',
      'DÉPLACEMENT': '#f57c00',
      'PRESENT': '#388e3c',
      'PRÉSENT': '#388e3c',
      'ASTREINTE': '#7b1fa2'
    };

    function formatIsoDateLocal(d) {
      const annee = d.getFullYear();
      const mois = String(d.getMonth() + 1).padStart(2, '0');
      const jour = String(d.getDate()).padStart(2, '0');
      return `${annee}-${mois}-${jour}`;
    }

    function parseDate(val) {
      if (!val) return null;
      if (typeof val === 'string') {
        const iso = val.match(/^(\d{4}-\d{2}-\d{2})/);
        if (iso) return iso[1];
        const fr = val.match(/^(\d{2})[-/](\d{2})[-/](\d{4})/);
        if (fr) return `${fr[3]}-${fr[2]}-${fr[1]}`;
      }
      if (typeof val === 'number') {
        const ts = val < 10000000000 ? val * 1000 : val;
        const d = new Date(ts);
        if (!isNaN(d.getTime())) return formatIsoDateLocal(d);
      }
      return null;
    }

    function addDays(strDate, nb) {
      if (!strDate) return strDate;
      const d = new Date(strDate);
      d.setDate(d.getDate() + nb);
      return formatIsoDateLocal(d);
    }

    function trouverValeur(row, cles) {
      if (!row) return null;
      for (const k of cles) {
        if (row[k] !== undefined && row[k] !== null) return row[k];
      }
      const reelles = Object.keys(row);
      for (const k of cles) {
        const pur = k.toLowerCase().replace(/[^a-z0-9]/g, '');
        for (const r of reelles) {
          if (r.toLowerCase().replace(/[^a-z0-9]/g, '') === pur) {
            if (row[r] !== undefined && row[r] !== null) return row[r];
          }
        }
      }
      return null;
    }

    const modalEl = document.getElementById('fenetre-voeu');
    const titreModal = document.getElementById('titre-modal');
    const selectAgent = document.getElementById('form-agent');
    const selectStatut = document.getElementById('form-statut');
    const inputDebut = document.getElementById('form-debut');
    const inputFin = document.getElementById('form-fin');
    const btnSupprimer = document.getElementById('btn-supprimer');

    function fermer() {
      modalEl.style.display = 'none';
      ligneSelectionneeId = null;
      btnSupprimer.style.display = 'none';
      if (calendar) calendar.unselect();
    }

    document.getElementById('btn-annuler').addEventListener('click', fermer);

    btnSupprimer.addEventListener('click', async function() {
      if (!ligneSelectionneeId) return;
      if (confirm("Supprimer ce vœu de présence ?")) {
        try {
          await grist.selectedTable.destroy([ligneSelectionneeId]);
        } catch(e) {
          try {
            await grist.docApi.applyUserActions([['RemoveRecord', 'Presences', ligneSelectionneeId]]);
          } catch(e2) {}
        }
        fermer();
      }
    });

    function majSelectAgents() {
      const choix = selectAgent.value;
      selectAgent.innerHTML = '<option value="">-- Choisir un membre --</option>';

      const vu = new Set();
      const liste = Array.from(annuaireAgents.entries()).sort((a, b) => a[1].localeCompare(b[1]));

      for (const [id, label] of liste) {
        if (!vu.has(label)) {
          vu.add(label);
          const opt = document.
