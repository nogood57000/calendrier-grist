<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Calendrier des présences</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales/fr.global.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }
    #calendar {
      height: 100vh;
      padding: 8px;
      box-sizing: border-box;
    }
    .fc-event {
      cursor: pointer;
      font-weight: 500;
    }
    #fenetre-voeu {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }
    .conteneur-formulaire {
      background: #ffffff;
      padding: 22px;
      border-radius: 8px;
      width: 330px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }
    .conteneur-formulaire h3 {
      margin: 0 0 16px 0;
      font-size: 16px;
      color: #1e293b;
    }
    .champ {
      margin-bottom: 12px;
    }
    .champ label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #475569;
    }
    .champ input, .champ select {
      width: 100%;
      padding: 7px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
    }
    .barre-boutons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }
    .btn {
      padding: 7px 14px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .btn-gris {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-bleu {
      background: #0284c7;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div id="calendar"></div>

  <!-- Formulaire modal -->
  <div id="fenetre-voeu">
    <div class="conteneur-formulaire">
      <h3>Nouveau vœu de présence</h3>
      
      <div class="champ">
        <label for="form-agent">Membre de l'équipe</label>
        <select id="form-agent">
          <option value="">Chargement des agents...</option>
        </select>
      </div>

      <div class="champ">
        <label for="form-statut">Statut</label>
        <select id="form-statut">
          <option value="CONGES">CONGES</option>
          <option value="TELETRAVAIL">TELETRAVAIL</option>
          <option value="EN DEPLACEMENT">EN DEPLACEMENT</option>
          <option value="PRESENT">PRESENT</option>
          <option value="ASTREINTE">ASTREINTE</option>
        </select>
      </div>

      <div class="champ">
        <label for="form-debut">Date de début</label>
        <input type="date" id="form-debut" />
      </div>

      <div class="champ">
        <label for="form-fin">Date de fin</label>
        <input type="date" id="form-fin" />
      </div>

      <div class="barre-boutons">
        <button type="button" class="btn btn-gris" id="btn-annuler">Annuler</button>
        <button type="button" class="btn btn-bleu" id="btn-valider">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    let calendar;
    // Map globale : Row ID numérique -> Libellé affiché complet
    const annuaireAgents = new Map();
    let donneesRecues = [];

    const COULEURS = {
      'CONFLIT': '#d32f2f',
      'CONGES': '#fbc02d',
      'CONGÉS': '#fbc02d',
      'TELETRAVAIL': '#1976d2',
      'TÉLÉTRAVAIL': '#1976d2',
      'EN DEPLACEMENT': '#f57c00',
      'DÉPLACEMENT': '#f57c00',
      'PRESENT': '#388e3c',
      'PRÉSENT': '#388e3c',
      'ASTREINTE': '#7b1fa2'
    };

    function addOneDay(str) {
      if (!str) return str;
      const d = new Date(str);
      d.setDate(d.getDate() + 1);
      return d.toISOString().split('T')[0];
    }

    function normaliser(s) {
      return String(s || '').toUpperCase().trim();
    }

    function nettoyerNom(val) {
      if (!val) return '';
      return String(val).replace(/^#Invalid Ref:\s*/i, '').trim();
    }

    const modalEl = document.getElementById('fenetre-voeu');
    const selectAgent = document.getElementById('form-agent');
    const selectStatut = document.getElementById('form-statut');
    const inputDebut = document.getElementById('form-debut');
    const inputFin = document.getElementById('form-fin');

    function fermer() {
      modalEl.style.display = 'none';
      if (calendar) calendar.unselect();
    }

    document.getElementById('btn-annuler').addEventListener('click', fermer);

    function rafraichirSelect() {
      const choixActuel = selectAgent.value;
      selectAgent.innerHTML = '<option value="">-- Choisir un membre --</option>';

      const listeTrie = Array.from(annuaireAgents.entries()).sort((a, b) => a[1].localeCompare(b[1]));
      for (const [id, libelle] of listeTrie) {
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = libelle;
        selectAgent.appendChild(opt);
      }

      if (choixActuel && annuaireAgents.has(parseInt(choixActuel, 10))) {
        selectAgent.value = choixActuel;
      }
    }

    // Récupération automatique de la table des agents
    async function chargerAnnuaireComplet() {
      try {
        const tables = await grist.docApi.listTables();
        for (const tableId of tables) {
          try {
            const data = await grist.docApi.fetchTable(tableId);
            if (!data || !data.id || data.id.length === 0) continue;

            const colonnes = Object.keys(data);
            const colIdentite = colonnes.find(c => /^identit[eé]/i.test(c));
            const colNom = colonnes.find(c => /^nom$/i.test(c) || /nom/i.test(c));
            const colPrenom = colonnes.find(c => /pr[eé]nom/i.test(c));
            const colFonction = colonnes.find(c => /fonction/i.test(c));

            // Si c'est bien la table contenant l'équipe
            if (colIdentite || (colNom && colPrenom)) {
              for (let i = 0; i < data.id.length; i++) {
                const rowId = data.id[i];
                let libelle = '';

                if (colIdentite && data[colIdentite][i]) {
                  const valId = data[colIdentite][i];
                  if (typeof valId === 'string' && valId.trim()) {
                    libelle = valId.trim();
                  }
                }

                if (!libelle && colNom) {
                  const n = (data[colNom] && data[colNom][i]) ? String(data[colNom][i]).trim() : '';
                  const p = (colPrenom && data[colPrenom][i]) ? String(data[colPrenom][i]).trim() : '';
                  const f = (colFonction && data[colFonction][i]) ? String(data[colFonction][i]).trim() : '';
                  if (n) {
                    libelle = `${n} ${p}${f ? ' - ' + f : ''}`.trim();
                  }
                }

                if (libelle && !libelle.startsWith('#')) {
                  annuaireAgents.set(rowId, libelle);
                }
              }
            }
          } catch (e) {}
        }
      } catch (err) {
        console.warn("Erreur listTables :", err);
      }

      rafraichirSelect();
      if (donneesRecues.length > 0) {
        afficherEvenements(donneesRecues);
      }
    }

    // Résolution du nom d'un événement à partir de n'importe quel champ
    function obtenirNomAgent(r) {
      // 1. Recherche par Row ID direct
      let id = null;
      if (typeof r.qui === 'number') id = r.qui;
      else if (typeof r.Agent === 'number') id = r.Agent;
      else if (r.qui && typeof r.qui === 'object' && r.qui.id) id = r.qui.id;
      else if (r.Agent && typeof r.Agent === 'object' && r.Agent.id) id = r.Agent.id;
      else {
        const parsed = parseInt(r.qui || r.Agent, 10);
        if (!isNaN(parsed) && String(parsed) === String(r.qui || r.Agent).trim()) {
          id = parsed;
        }
      }

      if (id !== null && annuaireAgents.has(id)) {
        return annuaireAgents.get(id);
      }

      // 2. Si c'est déjà une chaîne texte
      const texte = r.Agent || r.qui;
      if (typeof texte === 'string' && !/^\d+$/.test(texte.trim())) {
        return nettoyerNom(texte);
      }

      // 3. Si l'ID n'est pas encore résolu
      return (id !== null && annuaireAgents.has(id)) ? annuaireAgents.get(id) : ('Agent ' + (id || ''));
    }

    function afficherEvenements(records) {
      const valides = records.filter(r => (r.Date_debut || r.date_debut));
      const cumulAutoriseAstreinte = ['TELETRAVAIL', 'TÉLÉTRAVAIL', 'EN DEPLACEMENT', 'DÉPLACEMENT', 'PRESENT', 'PRÉSENT'];

      const events = valides.map((r, index, array) => {
        const debut = r.Date_debut || r.date_debut;
        const fin = r.Date_fin || r.date_fin || debut;
        const nomComplet = obtenirNomAgent(r);

        const statutBrut = String(r.STATUT || r.Statut || r.Statut_affiche || '').trim();
        const sNorm = normaliser(statutBrut);
        const statutConflitCol = normaliser(r.Statut_conflit);

        // Détection de conflit : chevauchement de dates pour la même personne
        // Exception tolérée : cumul ASTREINTE + (TELETRAVAIL / DEPLACEMENT / PRESENT)
        const doublonInterdit = array.some((autre, autreIdx) => {
          if (index === autreIdx) return false;

          const autreNom = obtenirNomAgent(autre);
          if (autreNom !== nomComplet) return false;

          const autreDebut = autre.Date_debut || autre.date_debut;
          const autreFin = autre.Date_fin || autre.date_fin || autreDebut;
          const chevauchement = (debut <= autreFin && fin >= autreDebut);

          if (!chevauchement) return false;

          const autreSNorm = normaliser(autre.STATUT || autre.Statut || autre.Statut_affiche);
          const unEstAstreinte = sNorm.includes('ASTREINTE');
          const autreEstAstreinte = autreSNorm.includes('ASTREINTE');

          if (unEstAstreinte && cumulAutoriseAstreinte.some(c => autreSNorm.includes(c))) return false;
          if (autreEstAstreinte && cumulAutoriseAstreinte.some(c => sNorm.includes(c))) return false;

          return true;
        });

        const estEnConflit = statutConflitCol.includes('CONFLIT') || doublonInterdit;

        let couleur = '#3788d8';
        let libelleAffiche = statutBrut;

        if (estEnConflit) {
          couleur = COULEURS['CONFLIT'];
          libelleAffiche = 'CONFLIT';
        } else {
          for (const [cle, val] of Object.entries(COULEURS)) {
            if (sNorm.includes(cle)) {
              couleur = val;
              break;
            }
          }
        }

        return {
          id: r.id,
          title: nomComplet + (libelleAffiche ? ' — ' + libelleAffiche : ''),
          start: debut,
          end: addOneDay(fin),
          backgroundColor: couleur,
          borderColor: couleur,
          allDay: true
        };
      });

      calendar.removeAllEvents();
      calendar.addEventSource(events);
    }

    document.getElementById('btn-valider').addEventListener('click', async function() {
      const agentId = parseInt(selectAgent.value, 10);
      const statut = selectStatut.value;
      const debut = inputDebut.value;
      const fin = inputFin.value;

      if (isNaN(agentId) || !debut || !fin) {
        alert("Veuillez sélectionner un membre de l'équipe et les dates.");
        return;
      }

      const champs = {
        Date_debut: debut,
        Date_fin: fin,
        STATUT: statut
      };

      // Tente d'enregistrer sur la colonne référence appropriée
      try {
        await grist.selectedTable.create({ fields: { ...champs, qui: agentId } });
        fermer();
      } catch (err) {
        try {
          await grist.selectedTable.create({ fields: { ...champs, Agent: agentId } });
          fermer();
        } catch (e2) {
          console.error("Échec création :", e2);
          alert("Erreur lors de l'enregistrement.");
        }
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');

      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'fr',
        firstDay: 1,
        selectable: true,
        selectMirror: false,
        allDayText: 'Programme journée',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,dayGridWeek'
        },
        buttonText: {
          today: "Aujourd'hui",
          month: 'Mois',
          week: 'Semaine'
        },

        select: async function(info) {
          inputDebut.value = info.startStr;
          const finCalculee = new Date(info.endStr);
          finCalculee.setDate(finCalculee.getDate() - 1);
          inputFin.value = finCalculee.toISOString().split('T')[0];

          await chargerAnnuaireComplet();
          modalEl.style.display = 'flex';
        },

        eventClick: function(info) {
          if (info.event.id) {
            grist.setCursorPos({ rowId: parseInt(info.event.id, 10) });
          }
        },

        events: []
      });

      calendar.render();
      grist.ready({ requiredAccess: 'full' });

      // Charger l'annuaire dès le démarrage
      chargerAnnuaireComplet();

      grist.onRecords(async function(records) {
        if (!records) return;
        donneesRecues = records;

        // Mémorisation de secours : si un enregistrement possède déjà son libellé complet
        records.forEach(r => {
          const id = (typeof r.qui === 'number') ? r.qui : (typeof r.Agent === 'number' ? r.Agent : parseInt(r.qui || r.Agent, 10));
          const texte = r.Agent || r.qui;
          if (!isNaN(id) && typeof texte === 'string' && !/^\d+$/.test(texte.trim()) && !texte.startsWith('#')) {
            annuaireAgents.set(id, nettoyerNom(texte));
          }
        });

        // Si des identifiants numériques restent non résolus, on relance la synchronisation
        const aDesNumerosSeuls = records.some(r => {
          const raw = r.qui || r.Agent;
          const id = parseInt(raw, 10);
          return !isNaN(id) && !annuaireAgents.has(id);
        });

        if (aDesNumerosSeuls) {
          await chargerAnnuaireComplet();
        } else {
          rafraichirSelect();
          afficherEvenements(records);
        }
      });
    });
  </script>
</body>
</html>
