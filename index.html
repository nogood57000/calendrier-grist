<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Calendrier des présences</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales/fr.global.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }
    #calendar {
      height: 100vh;
      padding: 8px;
      box-sizing: border-box;
    }
    .fc-event {
      cursor: pointer;
      font-weight: 500;
    }
    #fenetre-voeu {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }
    .conteneur-formulaire {
      background: #ffffff;
      padding: 22px;
      border-radius: 8px;
      width: 330px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }
    .conteneur-formulaire h3 {
      margin: 0 0 16px 0;
      font-size: 16px;
      color: #1e293b;
    }
    .champ {
      margin-bottom: 12px;
    }
    .champ label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #475569;
    }
    .champ input, .champ select {
      width: 100%;
      padding: 7px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
    }
    .barre-boutons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }
    .btn {
      padding: 7px 14px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .btn-gris {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-bleu {
      background: #0284c7;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div id="calendar"></div>

  <!-- Formulaire modal -->
  <div id="fenetre-voeu">
    <div class="conteneur-formulaire">
      <h3>Nouveau vœu de présence</h3>
      
      <div class="champ">
        <label for="form-agent">Membre de l'équipe</label>
        <select id="form-agent">
          <option value="">Chargement des agents...</option>
        </select>
      </div>

      <div class="champ">
        <label for="form-statut">Statut</label>
        <select id="form-statut">
          <option value="CONGES">CONGES</option>
          <option value="TELETRAVAIL">TELETRAVAIL</option>
          <option value="EN DEPLACEMENT">EN DEPLACEMENT</option>
          <option value="PRESENT">PRESENT</option>
          <option value="ASTREINTE">ASTREINTE</option>
        </select>
      </div>

      <div class="champ">
        <label for="form-debut">Date de début</label>
        <input type="date" id="form-debut" />
      </div>

      <div class="champ">
        <label for="form-fin">Date de fin</label>
        <input type="date" id="form-fin" />
      </div>

      <div class="barre-boutons">
        <button type="button" class="btn btn-gris" id="btn-annuler">Annuler</button>
        <button type="button" class="btn btn-bleu" id="btn-valider">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    let calendar;
    const annuaireAgents = new Map(); // id (numérique) -> Identité complète

    const COULEURS = {
      'CONFLIT': '#d32f2f',
      'CONGES': '#fbc02d',
      'CONGÉS': '#fbc02d',
      'TELETRAVAIL': '#1976d2',
      'TÉLÉTRAVAIL': '#1976d2',
      'EN DEPLACEMENT': '#f57c00',
      'DÉPLACEMENT': '#f57c00',
      'PRESENT': '#388e3c',
      'PRÉSENT': '#388e3c',
      'ASTREINTE': '#7b1fa2'
    };

    function addOneDay(str) {
      if (!str) return str;
      const d = new Date(str);
      d.setDate(d.getDate() + 1);
      return d.toISOString().split('T')[0];
    }

    function normaliser(s) {
      return String(s || '').toUpperCase().trim();
    }

    function formaterNom(nomBrut) {
      if (!nomBrut) return '';
      return String(nomBrut).replace(/^#Invalid Ref:\s*/i, '').trim();
    }

    const modalEl = document.getElementById('fenetre-voeu');
    const selectAgent = document.getElementById('form-agent');
    const selectStatut = document.getElementById('form-statut');
    const inputDebut = document.getElementById('form-debut');
    const inputFin = document.getElementById('form-fin');

    function fermer() {
      modalEl.style.display = 'none';
      if (calendar) calendar.unselect();
    }

    document.getElementById('btn-annuler').addEventListener('click', fermer);

    function rafraichirSelect() {
      const valeurChoisie = selectAgent.value;
      selectAgent.innerHTML = '<option value="">-- Choisir un membre --</option>';

      const liste = Array.from(annuaireAgents.entries()).sort((a, b) => a[1].localeCompare(b[1]));
      for (const [id, identite] of liste) {
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = identite;
        selectAgent.appendChild(opt);
      }

      if (valeurChoisie && annuaireAgents.has(parseInt(valeurChoisie, 10))) {
        selectAgent.value = valeurChoisie;
      }
    }

    // Récupère l'équipe dans la table contenant la colonne Identité
    async function chargerEquipeDTPJJ() {
      try {
        const tables = await grist.docApi.listTables();
        for (const tId of tables) {
          const tIdNorm = tId.toUpperCase();
          if (tIdNorm.includes('PREVISIONNEL') || tIdNorm.includes('CONGE')) continue;

          try {
            const data = await grist.docApi.fetchTable(tId);
            if (!data || !data.id || data.id.length === 0) continue;

            const cols = Object.keys(data);
            // On cible spécifiquement la colonne "Identité" ou "Identite"
            const colIdentite = cols.find(c => /^identit[eé]/i.test(c));

            if (colIdentite) {
              annuaireAgents.clear();
              for (let i = 0; i < data.id.length; i++) {
                const rowId = data.id[i];
                const identite = data[colIdentite][i];
                if (identite && typeof identite === 'string' && identite.trim()) {
                  annuaireAgents.set(rowId, identite.trim());
                }
              }
              rafraichirSelect();
              return; // Table cible trouvée
            }
          } catch (e) {}
        }
      } catch (err) {
        console.warn("Erreur chargement équipe :", err);
      }
      rafraichirSelect();
    }

    document.getElementById('btn-valider').addEventListener('click', async function() {
      const agentId = parseInt(selectAgent.value, 10);
      const statut = selectStatut.value;
      const debut = inputDebut.value;
      const fin = inputFin.value;

      if (isNaN(agentId) || !debut || !fin) {
        alert("Veuillez sélectionner un membre de l'équipe et les dates.");
        return;
      }

      const champs = {
        Date_debut: debut,
        Date_fin: fin,
        STATUT: statut
      };

      try {
        await grist.selectedTable.create({ fields: { ...champs, Agent: agentId } });
        fermer();
      } catch (err) {
        try {
          await grist.selectedTable.create({ fields: { ...champs, qui: agentId } });
          fermer();
        } catch (e2) {
          console.error("Échec création :", e2);
          alert("Erreur lors de l'enregistrement.");
        }
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');

      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'fr',
        firstDay: 1,
        selectable: true,
        selectMirror: false,
        allDayText: 'Programme journée',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,dayGridWeek'
        },
        buttonText: {
          today: "Aujourd'hui",
          month: 'Mois',
          week: 'Semaine'
        },

        select: async function(info) {
          inputDebut.value = info.startStr;
          const finCalculee = new Date(info.endStr);
          finCalculee.setDate(finCalculee.getDate() - 1);
          inputFin.value = finCalculee.toISOString().split('T')[0];

          await chargerEquipeDTPJJ();
          modalEl.style.display = 'flex';
        },

        eventClick: function(info) {
          if (info.event.id) {
            grist.setCursorPos({ rowId: parseInt(info.event.id, 10) });
          }
        },

        events: []
      });

      calendar.render();
      grist.ready({ requiredAccess: 'full' });

      chargerEquipeDTPJJ();

      grist.onRecords(function(records) {
        if (!records) return;

        // Préparation des événements
        const valides = records.filter(r => (r.Date_debut || r.date_debut));
        const cumulAutoriseAstreinte = ['TELETRAVAIL', 'TÉLÉTRAVAIL', 'EN DEPLACEMENT', 'DÉPLACEMENT', 'PRESENT', 'PRÉSENT'];

        const events = valides.map((r, index, array) => {
          const debut = r.Date_debut || r.date_debut;
          const fin = r.Date_fin || r.date_fin || debut;

          const idAgent = (typeof r.Agent === 'number') ? r.Agent : ((typeof r.qui === 'number') ? r.qui : null);
          const nomComplet = (idAgent && annuaireAgents.get(idAgent)) 
            ? annuaireAgents.get(idAgent) 
            : formaterNom(r.Agent || r.qui || 'Agent');

          const statutBrut = String(r.STATUT || r.Statut || r.Statut_affiche || '').trim();
          const sNorm = normaliser(statutBrut);
          const statutConflitCol = normaliser(r.Statut_conflit);

          // Conflit si chevauchement sauf combinaison ASTREINTE + (TELETRAVAIL / DEPLACEMENT / PRESENT)
          const doublonInterdit = array.some((autre, autreIdx) => {
            if (index === autreIdx) return false;

            const autreId = (typeof autre.Agent === 'number') ? autre.Agent : ((typeof autre.qui === 'number') ? autre.qui : null);
            const autreNom = (autreId && annuaireAgents.get(autreId)) 
              ? annuaireAgents.get(autreId) 
              : formaterNom(autre.Agent || autre.qui);

            if (autreNom !== nomComplet) return false;

            const autreDebut = autre.Date_debut || autre.date_debut;
            const autreFin = autre.Date_fin || autre.date_fin || autreDebut;
            const chevauchement = (debut <= autreFin && fin >= autreDebut);

            if (!chevauchement) return false;

            const autreSNorm = normaliser(autre.STATUT || autre.Statut || autre.Statut_affiche);
            const unEstAstreinte = sNorm.includes('ASTREINTE');
            const autreEstAstreinte = autreSNorm.includes('ASTREINTE');

            if (unEstAstreinte && cumulAutoriseAstreinte.some(c => autreSNorm.includes(c))) return false;
            if (autreEstAstreinte && cumulAutoriseAstreinte.some(c => sNorm.includes(c))) return false;

            return true;
          });

          const estEnConflit = statutConflitCol.includes('CONFLIT') || doublonInterdit;

          let couleur = '#3788d8';
          let libelleAffiche = statutBrut;

          if (estEnConflit) {
            couleur = COULEURS['CONFLIT'];
            libelleAffiche = 'CONFLIT';
          } else {
            for (const [cle, val] of Object.entries(COULEURS)) {
              if (sNorm.includes(cle)) {
                couleur = val;
                break;
              }
            }
          }

          return {
            id: r.id,
            title: nomComplet + (libelleAffiche ? ' — ' + libelleAffiche : ''),
            start: debut,
            end: addOneDay(fin),
            backgroundColor: couleur,
            borderColor: couleur,
            allDay: true
          };
        });

        calendar.removeAllEvents();
        calendar.addEventSource(events);
      });
    });
  </script>
</body>
</html>
