<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Calendrier des présences</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales/fr.global.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }
    #calendar {
      height: 100vh;
      padding: 8px;
      box-sizing: border-box;
    }
    .fc-event {
      cursor: pointer;
      font-weight: 500;
    }
    #fenetre-voeu {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }
    .conteneur-formulaire {
      background: #ffffff;
      padding: 22px;
      border-radius: 8px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }
    .conteneur-formulaire h3 {
      margin: 0 0 16px 0;
      font-size: 16px;
      color: #1e293b;
    }
    .champ {
      margin-bottom: 12px;
    }
    .champ label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #475569;
    }
    .champ input, .champ select {
      width: 100%;
      padding: 7px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
    }
    .barre-boutons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }
    .btn {
      padding: 7px 14px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .btn-gris {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-bleu {
      background: #0284c7;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div id="calendar"></div>

  <!-- Formulaire de saisie -->
  <div id="fenetre-voeu">
    <div class="conteneur-formulaire">
      <h3>Nouveau vœu de présence</h3>
      
      <div class="champ">
        <label for="form-agent">Membre de l'équipe</label>
        <select id="form-agent"></select>
      </div>

      <div class="champ">
        <label for="form-statut">Statut</label>
        <select id="form-statut">
          <option value="CONGES">CONGES</option>
          <option value="TELETRAVAIL">TELETRAVAIL</option>
          <option value="EN DEPLACEMENT">EN DEPLACEMENT</option>
          <option value="PRESENT">PRESENT</option>
          <option value="ASTREINTE">ASTREINTE</option>
        </select>
      </div>

      <div class="champ">
        <label for="form-debut">Date de début</label>
        <input type="date" id="form-debut" />
      </div>

      <div class="champ">
        <label for="form-fin">Date de fin</label>
        <input type="date" id="form-fin" />
      </div>

      <div class="barre-boutons">
        <button type="button" class="btn btn-gris" id="btn-annuler">Annuler</button>
        <button type="button" class="btn btn-bleu" id="btn-valider">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    let calendar;
    const mapAgents = new Map();

    const COULEURS = {
      'CONFLIT': '#d32f2f',        // Rouge
      'CONGES': '#fbc02d',         // Jaune
      'CONGÉS': '#fbc02d',
      'TELETRAVAIL': '#1976d2',    // Bleu
      'TÉLÉTRAVAIL': '#1976d2',
      'EN DEPLACEMENT': '#f57c00', // Orange
      'DÉPLACEMENT': '#f57c00',
      'PRESENT': '#388e3c',        // Vert
      'PRÉSENT': '#388e3c',
      'ASTREINTE': '#7b1fa2'       // Violet
    };

    function addOneDay(str) {
      if (!str) return str;
      const d = new Date(str);
      d.setDate(d.getDate() + 1);
      return d.toISOString().split('T')[0];
    }

    function formaterNom(nomBrut) {
      if (!nomBrut) return 'Agent';
      return String(nomBrut).replace(/^#Invalid Ref:\s*/i, '').trim();
    }

    function normaliserStatut(s) {
      return String(s || '').toUpperCase().trim();
    }

    const modalEl = document.getElementById('fenetre-voeu');
    const selectAgent = document.getElementById('form-agent');
    const selectStatut = document.getElementById('form-statut');
    const inputDebut = document.getElementById('form-debut');
    const inputFin = document.getElementById('form-fin');

    function fermer() {
      modalEl.style.display = 'none';
      if (calendar) calendar.unselect();
    }

    document.getElementById('btn-annuler').addEventListener('click', fermer);

    document.getElementById('btn-valider').addEventListener('click', async function() {
      const agentIdStr = selectAgent.value;
      const statut = selectStatut.value;
      const debut = inputDebut.value;
      const fin = inputFin.value;

      if (!debut || !fin) {
        alert("Veuillez sélectionner des dates valides.");
        return;
      }

      const champs = {
        Date_debut: debut,
        Date_fin: fin,
        STATUT: statut
      };

      const idNumerique = parseInt(agentIdStr, 10);
      if (!isNaN(idNumerique) && idNumerique > 0) {
        champs.qui = idNumerique;
      }

      try {
        await grist.selectedTable.create({ fields: champs });
        fermer();
      } catch (err) {
        console.error("Erreur à la création :", err);
        alert("Impossible d'enregistrer le vœu.");
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');

      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'fr',
        firstDay: 1,
        selectable: true,
        selectMirror: false,
        allDayText: 'Programme journée',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,dayGridWeek'
        },
        buttonText: {
          today: "Aujourd'hui",
          month: 'Mois',
          week: 'Semaine'
        },

        select: function(info) {
          inputDebut.value = info.startStr;
          const finCalculee = new Date(info.endStr);
          finCalculee.setDate(finCalculee.getDate() - 1);
          inputFin.value = finCalculee.toISOString().split('T')[0];
          modalEl.style.display = 'flex';
        },

        eventClick: function(info) {
          if (info.event.id) {
            grist.setCursorPos({ rowId: parseInt(info.event.id, 10) });
          }
        },

        events: []
      });

      calendar.render();

      grist.ready({ requiredAccess: 'full' });

      grist.onRecords(function(records) {
        if (!records) return;

        // Récupération des agents et de leur ID
        records.forEach(r => {
          let idAgent = null;
          if (typeof r.qui === 'number') {
            idAgent = r.qui;
          } else if (r.qui && typeof r.qui === 'object' && r.qui.id) {
            idAgent = r.qui.id;
          }

          const nomAffiche = r.Agent || (typeof r.qui === 'string' ? r.qui : null);
          if (idAgent && nomAffiche && !String(nomAffiche).startsWith('#Invalid Ref')) {
            mapAgents.set(idAgent, formaterNom(nomAffiche));
          }
        });

        // Mise à jour des choix d'agents
        const valeurCourante = selectAgent.value;
        selectAgent.innerHTML = '';
        Array.from(mapAgents.entries())
          .sort((a, b) => a[1].localeCompare(b[1]))
          .forEach(([id, nom]) => {
            const opt = document.createElement('option');
            opt.value = id;
            opt.textContent = nom;
            selectAgent.appendChild(opt);
          });
        if (valeurCourante) selectAgent.value = valeurCourante;

        // Liste filtrée des enregistrements ayant des dates
        const valides = records.filter(r => (r.Date_debut || r.date_debut));

        const events = valides.map((r, index, array) => {
          const debut = r.Date_debut || r.date_debut;
          const fin = r.Date_fin || r.date_fin || debut;
          const nomComplet = formaterNom(r.Agent || r.qui);
          
          const statutBrut = String(r.STATUT || r.Statut || r.Statut_affiche || '').trim();
          const sNorm = normaliserStatut(statutBrut);
          const statutConflitCol = normaliserStatut(r.Statut_conflit);

          // Détection de conflit avec les règles métier :
          // L'ASTREINTE peut coexister avec TELETRAVAIL, EN DEPLACEMENT ou PRESENT
          const cumulAutoriseAstreinte = ['TELETRAVAIL', 'TÉLÉTRAVAIL', 'EN DEPLACEMENT', 'DÉPLACEMENT', 'PRESENT', 'PRÉSENT'];

          const doublonInterdit = array.some((autre, autreIdx) => {
            if (index === autreIdx) return false;
            const autreNom = formaterNom(autre.Agent || autre.qui);
            if (autreNom !== nomComplet) return false;

            const autreDebut = autre.Date_debut || autre.date_debut;
            const autreFin = autre.Date_fin || autre.date_fin || autreDebut;
            const chevauchement = (debut <= autreFin && fin >= autreDebut);

            if (!chevauchement) return false;

            const autreSNorm = normaliserStatut(autre.STATUT || autre.Statut || autre.Statut_affiche);

            // Cas toléré : l'un est ASTREINTE et l'autre est dans la liste autorisée
            const unEstAstreinte = sNorm.includes('ASTREINTE');
            const autreEstAstreinte = autreSNorm.includes('ASTREINTE');

            if (unEstAstreinte && cumulAutoriseAstreinte.some(c => autreSNorm.includes(c))) {
              return false; // Pas de conflit
            }
            if (autreEstAstreinte && cumulAutoriseAstreinte.some(c => sNorm.includes(c))) {
              return false; // Pas de conflit
            }

            // Tout autre chevauchement (ex: 2 présences, congé + télétravail, congé + astreinte) est un conflit
            return true;
          });

          const estEnConflit = statutConflitCol.includes('CONFLIT') || doublonInterdit;

          let couleur = '#3788d8';
          let libelleAffiche = statutBrut;

          if (estEnConflit) {
            couleur = COULEURS['CONFLIT'];
            libelleAffiche = 'CONFLIT';
          } else {
            for (const [cle, val] of Object.entries(COULEURS)) {
              if (sNorm.includes(cle)) {
                couleur = val;
                break;
              }
            }
          }

          return {
            id: r.id,
            title: nomComplet + (libelleAffiche ? ' — ' + libelleAffiche : ''),
            start: debut,
            end: addOneDay(fin),
            backgroundColor: couleur,
            borderColor: couleur,
            allDay: true
          };
        });

        calendar.removeAllEvents();
        calendar.addEventSource(events);
      });
    });
  </script>
</body>
</html>
