<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales/fr.global.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      height: 100%;
      overflow: hidden;
    }
    #calendar {
      height: 100vh;
      padding: 8px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="calendar"></div>

  <script>
    let calendar;

    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'fr', // Traduction en français (lun., mar., Aujourd'hui, Mois...)
        firstDay: 1,  // Semaine débutant le lundi
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        buttonText: {
          today: "Aujourd'hui",
          month: 'Mois',
          week: 'Semaine',
          day: 'Jour'
        },
        events: []
      });
      calendar.render();

      // Liaison avec les données Grist
      grist.ready({ requiredAccess: 'read table' });
      grist.onRecords(function(records) {
        const events = records.map(r => {
          // Ajuste les noms des colonnes selon la structure exacte de la table
          const debut = r.Date_debut || r.date_debut;
          const fin = r.Date_fin || r.date_fin;
          const agent = r.Agent || r.qui || 'Événement';
          const statut = r.Statut || r.Statut_affiche || '';

          // Couleurs selon les statuts
          let couleur = '#3788d8';
          if (statut === 'CONFLIT') couleur = '#d32f2f';
          else if (statut === 'CONGES') couleur = '#fbc02d';
          else if (statut === 'TELETRAVAIL') couleur = '#1976d2';
          else if (statut === 'EN DEPLACEMENT') couleur = '#f57c00';
          else if (statut === 'PRESENT') couleur = '#388e3c';

          return {
            id: r.id,
            title: agent + (statut ? ' - ' + statut : ''),
            start: debut,
            // FullCalendar exclut le jour de fin sur les journées entières :
            // si besoin, ajouter un jour à 'end' côté affichage
            end: fin,
            backgroundColor: couleur,
            borderColor: couleur,
            allDay: true
          };
        });

        calendar.removeAllEvents();
        calendar.addEventSource(events);
      });
    });
  </script>
</body>
</html>
