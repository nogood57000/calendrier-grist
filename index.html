<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales/fr.global.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100%;
      overflow: hidden;
    }
    #calendar {
      height: 100vh;
      padding: 8px;
      box-sizing: border-box;
    }
    .fc-event {
      cursor: pointer;
      font-weight: 500;
    }
    #modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    #modal-box {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      width: 320px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    #modal-box h3 {
      margin-top: 0;
      margin-bottom: 14px;
      font-size: 16px;
      color: #1e293b;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #475569;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }
    .btn {
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-cancel {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-save {
      background: #0284c7;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div id="calendar"></div>

  <div id="modal-overlay">
    <div id="modal-box">
      <h3>Nouveau vœu de présence</h3>
      <div class="form-group">
        <label for="input-agent">Membre de l'équipe</label>
        <select id="input-agent"></select>
      </div>
      <div class="form-group">
        <label for="input-statut">Statut</label>
        <select id="input-statut">
          <option value="CONGES">CONGES</option>
          <option value="TELETRAVAIL">TELETRAVAIL</option>
          <option value="EN DEPLACEMENT">EN DEPLACEMENT</option>
          <option value="PRESENT">PRESENT</option>
          <option value="CONFLIT">CONFLIT</option>
        </select>
      </div>
      <div class="form-group">
        <label for="input-debut">Date de début</label>
        <input type="date" id="input-debut" />
      </div>
      <div class="form-group">
        <label for="input-fin">Date de fin</label>
        <input type="date" id="input-fin" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-cancel" id="btn-cancel">Annuler</button>
        <button type="button" class="btn btn-save" id="btn-save">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    let calendar;
    const agentsConnus = new Set();

    const COULEURS = {
      'CONFLIT': '#d32f2f',
      'CONGES': '#fbc02d',
      'CONGÉS': '#fbc02d',
      'TELETRAVAIL': '#1976d2',
      'TÉLÉTRAVAIL': '#1976d2',
      'EN DEPLACEMENT': '#f57c00',
      'DÉPLACEMENT': '#f57c00',
      'PRESENT': '#388e3c',
      'PRÉSENT': '#388e3c',
      'ASTREINTE': '#7b1fa2'
    };

    function addOneDay(dateStr) {
      if (!dateStr) return dateStr;
      const d = new Date(dateStr);
      d.setDate(d.getDate() + 1);
      return d.toISOString().split('T')[0];
    }

    function removeOneDay(dateStr) {
      if (!dateStr) return dateStr;
      const d = new Date(dateStr);
      d.setDate(d.getDate() - 1);
      return d.toISOString().split('T')[0];
    }

    const modal = document.getElementById('modal-overlay');
    const inputAgent = document.getElementById('input-agent');
    const inputStatut = document.getElementById('input-statut');
    const inputDebut = document.getElementById('input-debut');
    const inputFin = document.getElementById('input-fin');
    const btnCancel = document.getElementById('btn-cancel');
    const btnSave = document.getElementById('btn-save');

    function fermerModale() {
      modal.style.display = 'none';
      if (calendar) calendar.unselect();
    }

    btnCancel.addEventListener('click', fermerModale);

    btnSave.addEventListener('click', async function() {
      const agent = inputAgent.value;
      const statut = inputStatut.value;
      const debut = inputDebut.value;
      const fin = inputFin.value;

      if (!agent || !debut || !fin) {
        alert("Veuillez renseigner un agent et les dates.");
        return;
      }

      try {
        await grist.selectedTable.create({
          fields: {
            Date_debut: debut,
            Date_fin: fin,
            qui: agent,
            Agent: agent,
            STATUT: statut,
            Statut: statut
          }
        });
        fermerModale();
      } catch (err) {
        console.error("Erreur lors de la création :", err);
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');

      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'fr',
        firstDay: 1,
        selectable: true,
        selectMirror: false,
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,dayGridWeek'
        },
        buttonText: {
          today: "Aujourd'hui",
          month: 'Mois',
          week: 'Semaine'
        },
        select: function(info) {
          inputDebut.value = info.startStr;
          inputFin.value = removeOneDay(info.endStr);
          modal.style.display = 'flex';
