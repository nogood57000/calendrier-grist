<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Calendrier des présences</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales/fr.global.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      overflow: hidden;
    }

    #barre-legende {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
    }
    .item-legende {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pastille {
      width: 13px;
      height: 13px;
      border-radius: 3px;
      display: inline-block;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }

    #calendar-container {
      flex: 1;
      min-height: 0;
      padding: 8px;
      box-sizing: border-box;
      position: relative;
    }
    #calendar {
      height: 100%;
    }

    #compteur-debug {
      position: absolute;
      bottom: 6px;
      right: 12px;
      font-size: 11px;
      color: #94a3b8;
      z-index: 5;
      pointer-events: none;
    }

    .fc-event, 
    .fc-daygrid-event, 
    .fc-daygrid-block-event {
      white-space: normal !important;
      min-height: 36px !important;
      margin-bottom: 3px !important;
      border-radius: 4px !important;
      border: none !important;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    .fc-event-main {
      padding: 2px 5px !important;
      white-space: normal !important;
    }

    .event-card {
      display: flex;
      flex-direction: column;
      gap: 2px;
      line-height: 1.2;
      text-align: left;
    }

    .event-ligne-statut {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.25);
      padding: 1px 4px;
      border-radius: 2px;
      width: fit-content;
    }

    .event-ligne-nom {
      font-size: 11px;
      font-weight: 600;
      word-break: break-word;
    }

    #fenetre-voeu {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }
    .conteneur-formulaire {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }
    .conteneur-formulaire h3 {
      margin: 0 0 14px 0;
      font-size: 15px;
      color: #1e293b;
    }
    .champ {
      margin-bottom: 10px;
    }
    .champ label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #475569;
    }
    .champ input, .champ select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
      background: #ffffff;
    }
    .barre-boutons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
    }
    .groupe-actions-droite {
      display: flex;
      gap: 8px;
    }
    .btn {
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    .btn-gris {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-bleu {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-rouge {
      background: #fee2e2;
      color: #b91c1c;
    }
  </style>
</head>
<body>

  <div id="barre-legende">
    <span style="font-size: 11px; text-transform: uppercase; color: #64748b; margin-right: 4px;">Légende :</span>
    <span class="item-legende"><span class="pastille" style="background:#fbc02d;"></span> Congés</span>
    <span class="item-legende"><span class="pastille" style="background:#1976d2;"></span> Télétravail</span>
    <span class="item-legende"><span class="pastille" style="background:#f57c00;"></span> Déplacement</span>
    <span class="item-legende"><span class="pastille" style="background:#388e3c;"></span> Présent</span>
    <span class="item-legende"><span class="pastille" style="background:#7b1fa2;"></span> Astreinte</span>
    <span class="item-legende"><span class="pastille" style="background:#d32f2f;"></span> Conflit ⚠</span>
  </div>

  <div id="calendar-container">
    <div id="calendar"></div>
    <div id="compteur-debug">Prêt</div>
  </div>

  <div id="fenetre-voeu">
    <div class="conteneur-formulaire">
      <h3 id="titre-modal">Nouveau vœu de présence</h3>
      
      <div class="champ">
        <label for="form-agent">Membre de l'équipe</label>
        <select id="form-agent">
          <option value="">Chargement...</option>
        </select>
      </div>

      <div class="champ">
        <label for="form-statut">Statut</label>
        <select id="form-statut">
          <option value="CONGES">CONGES</option>
          <option value="TELETRAVAIL">TELETRAVAIL</option>
          <option value="EN DEPLACEMENT">EN DEPLACEMENT</option>
          <option value="PRESENT">PRESENT</option>
          <option value="ASTREINTE">ASTREINTE</option>
        </select>
      </div>

      <div class="champ">
        <label for="form-debut">Date de début</label>
        <input type="date" id="form-debut" />
      </div>

      <div class="champ">
        <label for="form-fin">Date de fin</label>
        <input type="date" id="form-fin" />
      </div>

      <div class="barre-boutons">
        <button type="button" class="btn btn-rouge" id="btn-supprimer" style="display: none;">Supprimer</button>
        <div class="groupe-actions-droite">
          <button type="button" class="btn btn-gris" id="btn-annuler">Annuler</button>
          <button type="button" class="btn btn-bleu" id="btn-valider">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let calendar = null;
    const annuaireAgents = new Map();
    let ligneSelectionneeId = null;

    const COULEURS = {
      'CONFLIT': '#d32f2f',
      'CONGES': '#fbc02d',
      'CONGÉS': '#fbc02d',
      'TELETRAVAIL': '#1976d2',
      'TÉLÉTRAVAIL': '#1976d2',
      'EN DEPLACEMENT': '#f57c00',
      'DÉPLACEMENT': '#f57c00',
      'PRESENT': '#388e3c',
      'PRÉSENT': '#388e3c',
      'ASTREINTE': '#7b1fa2'
    };

    function parseDate(val) {
      if (!val) return null;
      if (typeof val === 'string') {
        const iso = val.match(/^(\d{4}-\d{2}-\d{2})/);
        if (iso) return iso[1];
        const fr = val.match(/^(\d{2})[-/](\d{2})[-/](\d{4})/);
        if (fr) return `${fr[3]}-${fr[2]}-${fr[1]}`;
      }
      if (typeof val === 'number') {
        const ts = val < 10000000000 ? val * 1000 : val;
        const d = new Date(ts);
        if (!isNaN(d.getTime())) return d.toISOString().split('T')[0];
      }
      return null;
    }

    function addDays(strDate, nb) {
      if (!strDate) return strDate;
      const d = new Date(strDate);
      d.setDate(d.getDate() + nb);
      return d.toISOString().split('T')[0];
    }

    function trouverValeur(row, cles) {
      if (!row) return null;
      for (const k of cles) {
        if (row[k] !== undefined && row[k] !== null) return row[k];
      }
      const reelles = Object.keys(row);
      for (const k of cles) {
        const pur = k.toLowerCase().replace(/[^a-z0-9]/g, '');
        for (const r of reelles) {
          if (r.toLowerCase().replace(/[^a-z0-9]/g, '') === pur) {
            if (row[r] !== undefined && row[r] !== null) return row[r];
          }
        }
      }
      return null;
    }

    const modalEl = document.getElementById('fenetre-voeu');
    const titreModal = document.getElementById('titre-modal');
    const selectAgent = document.getElementById('form-agent');
    const selectStatut = document.getElementById('form-statut');
    const inputDebut = document.getElementById('form-debut');
    const inputFin = document.getElementById('form-fin');
    const btnSupprimer = document.getElementById('btn-supprimer');
    const debugEl = document.getElementById('compteur-debug');

    function fermer() {
      modalEl.style.display = 'none';
      ligneSelectionneeId = null;
      btnSupprimer.style.display = 'none';
      if (calendar) calendar.unselect();
    }

    document.getElementById('btn-annuler').addEventListener('click', fermer);

    btnSupprimer.addEventListener('click', async function() {
      if (!ligneSelectionneeId) return;
      if (confirm("Supprimer cette présence ?")) {
        try {
          await grist.selectedTable.destroy([ligneSelectionneeId]);
        } catch(e) {
          try {
            await grist.docApi.applyUserActions([['RemoveRecord', 'Presences', ligneSelectionneeId]]);
          } catch(e2) {}
        }
        fermer();
      }
    });

    function majSelectAgents() {
      const choix = selectAgent.value;
      selectAgent.innerHTML = '<option value="">-- Choisir un membre --</option>';

      const liste = Array.from(annuaireAgents.entries()).sort((a, b) => a[1].localeCompare(b[1]));
      for (const [id, label] of liste) {
        const opt = document.createElement('option');
        opt.value = String(id);
        opt.textContent = label;
        selectAgent.appendChild(opt);
      }

      if (choix && annuaireAgents.has(choix)) {
        selectAgent.value = choix;
      }
    }

    async function chargerAnnuaireDirect() {
      try {
        const t = await grist.docApi.fetchTable('Equipe_en_DTPJJ_de_Moselle');
        if (t && t.id) {
          for (let i = 0; i < t.id.length; i++) {
            const rowId = t.id[i];
            const nom = t.Nom ? (t.Nom[i] || '') : '';
            const prenom = t.Prenom ? (t.Prenom[i] || '') : '';
            const fonc = t.Fonction ? (t.Fonction[i] || '') : '';
            const lib = `${nom} ${prenom}${fonc ? ' - ' + fonc : ''}`.trim() || `Agent #${rowId}`;
            annuaireAgents.set(String(rowId), lib);
          }
          majSelectAgents();
        }
      } catch(e) {}
    }

    function traiterDonnees(records) {
      if (!records || !calendar) return;

      // 1. Découverte des agents
      records.forEach(r => {
        const q = trouverValeur(r, ['Agent', 'qui']);
        const txt = trouverValeur(r, ['Agent', 'Identite']);
        if (typeof q === 'number') {
          const nom = (typeof txt === 'string' && !/^\d+$/.test(txt.trim())) ? txt.trim() : `Agent #${q}`;
          annuaireAgents.set(String(q), nom);
        } else if (typeof q === 'string' && q.trim()) {
          annuaireAgents.set(q.trim(), q.trim());
        } else if (q && typeof q === 'object' && q.id) {
          annuaireAgents.set(String(q.id), q.Identite || `Agent #${q.id}`);
        }
      });
      majSelectAgents();

      const cumulAutoriseAstreinte = ['TELETRAVAIL', 'TÉLÉTRAVAIL', 'EN DEPLACEMENT', 'DÉPLACEMENT', 'PRESENT', 'PRÉSENT'];

      // 2. Conversion
      const valides = records.map(r => {
        const debut = parseDate(trouverValeur(r, ['Date début', 'Date_debut', 'date_debut']));
        const fin = parseDate(trouverValeur(r, ['Date fin', 'Date_fin', 'date_fin'])) || debut;
        const agentVal = trouverValeur(r, ['Agent', 'qui']);
        const statut = String(trouverValeur(r, ['STATUT', 'Statut']) || '').trim();
        const statutConf = String(trouverValeur(r, ['Statut conflit', 'Statut_conflit', 'Statut2']) || 'OK').trim();

        let agentNom = 'Agent';
        let agentCle = '';

        if (typeof agentVal === 'string' && agentVal.trim()) {
          agentNom = agentVal.trim();
          agentCle = agentVal.trim();
        } else if (typeof agentVal === 'number') {
          agentCle = String(agentVal);
          agentNom = annuaireAgents.get(agentCle) || `Agent #${agentVal}`;
        } else if (agentVal && typeof agentVal === 'object' && agentVal.id) {
          agentCle = String(agentVal.id);
          agentNom = agentVal.Identite || annuaireAgents.get(agentCle) || `Agent #${agentVal.id}`;
        }

        return {
          id: r.id,
          agentCle: agentCle,
          agentNom: agentNom,
          debut: debut,
          fin: fin,
          statut: statut,
          statutConflit: statutConf
        };
      }).filter(r => Boolean(r.debut));

      debugEl.textContent = `${valides.length} présence(s) chargée(s)`;

      // 3. Détection conflits et mise en forme
      const events = valides.map((r, index, array) => {
        const sNorm = r.statut.toUpperCase();
        const confNorm = r.statutConflit.toUpperCase();

        const doublonInterdit = array.some((autre, autreIdx) => {
          if (index === autreIdx) return false;
          if (!r.agentCle || r.agentCle !== autre.agentCle) return false;

          const chevauche = (r.debut <= autre.fin && r.fin >= autre.debut);
          if (!chevauche) return false;

          const autreSNorm = autre.statut.toUpperCase();
          const unAstreinte = sNorm.includes('ASTREINTE');
          const autreAstreinte = autreSNorm.includes('ASTREINTE');

          if (unAstreinte && cumulAutoriseAstreinte.some(c => autreSNorm.includes(c))) return false;
          if (autreAstreinte && cumulAutoriseAstreinte.some(c => sNorm.includes(c))) return false;

          return true;
        });

        const estEnConflit = confNorm.includes('CONFLIT') || doublonInterdit;

        let couleur = '#3788d8';
        if (estEnConflit) {
          couleur = COULEURS['CONFLIT'];
        } else {
          for (const [cle, val] of Object.entries(COULEURS)) {
            if (sNorm.includes(cle)) {
              couleur = val;
              break;
            }
          }
        }

        const badgeTexte = estEnConflit ? 'CONFLIT ⚠' : (r.statut || 'PRESENCE');

        return {
          id: String(r.id),
          title: `[${badgeTexte}] ${r.agentNom}`,
          start: r.debut,
          end: addDays(r.fin, 1),
          backgroundColor: couleur,
          borderColor: couleur,
          allDay: true,
          extendedProps: {
            rowId: r.id,
            agentCle: r.agentCle,
            agentNom: r.agentNom,
            statutInitial: r.statut,
            statutBadge: badgeTexte,
            debutReel: r.debut,
            finReelle: r.fin,
            periodeTexte: `${r.debut} au ${r.fin}`
          }
        };
      });

      calendar.removeAllEvents();
      calendar.addEventSource(events);
    }

    document.getElementById('btn-valider').addEventListener('click', async function() {
      const agentVal = selectAgent.value;
      const statut = selectStatut.value;
      const debut = inputDebut.value;
      const fin = inputFin.value;

      if (!agentVal || !debut || !fin) {
        alert("Veuillez sélectionner un membre et des dates valides.");
        return;
      }

      const agentNum = parseInt(agentVal, 10);
      const refAgent = isNaN(agentNum) ? agentVal : agentNum;

      const fieldsIso = { "Date début": debut, "Date fin": fin, "Agent": refAgent, "STATUT": statut };
      const fieldsAlt = { "Date_debut": debut, "Date_fin": fin, "qui": refAgent, "STATUT": statut };

      try {
        if (ligneSelectionneeId) {
          await grist.selectedTable.update({ id: ligneSelectionneeId, fields: fieldsIso });
        } else {
          await grist.selectedTable.create({ fields: fieldsIso });
        }
        fermer();
      } catch(e) {
        try {
          if (ligneSelectionneeId) {
            await grist.selectedTable.update({ id: ligneSelectionneeId, fields: fieldsAlt });
          } else {
            await grist.selectedTable.create({ fields: fieldsAlt });
          }
          fermer();
        } catch(e2) {
          alert("Erreur lors de l'enregistrement.");
        }
      }
    });

    function initialiser() {
      const calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'fr',
        firstDay: 1,
        selectable: true,
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,dayGridWeek'
        },
        buttonText: {
          today: "Aujourd'hui",
          month: 'Mois',
          week: 'Semaine'
        },
        eventContent: function(arg) {
          const badge = arg.event.extendedProps.statutBadge || '';
          const nom = arg.event.extendedProps.agentNom || arg.event.title;
          const conteneur = document.createElement('div');
          conteneur.className = 'event-card';
          conteneur.title = `${nom}\n${badge}\n${arg.event.extendedProps.periodeTexte || ''}`;
          conteneur.innerHTML = `
            <div><span class="event-ligne-statut">${badge}</span></div>
            <div class="event-ligne-nom">${nom}</div>
          `;
          return { domNodes: [conteneur] };
        },
        select: function(info) {
          ligneSelectionneeId = null;
          titreModal.textContent = "Nouveau vœu de présence";
          btnSupprimer.style.display = "none";
          inputDebut.value = info.startStr;
          const f = new Date(info.endStr);
          f.setDate(f.getDate() - 1);
          inputFin.value = f.toISOString().split('T')[0];
          majSelectAgents();
          modalEl.style.display = 'flex';
        },
        eventClick: function(info) {
          const props = info.event.extendedProps;
          ligneSelectionneeId = props.rowId;
          titreModal.textContent = "Modifier la présence";
          btnSupprimer.style.display = "inline-block";
          inputDebut.value = props.debutReel;
          inputFin.value = props.finReelle;
          majSelectAgents();
          if (props.agentCle && annuaireAgents.has(props.agentCle)) {
            selectAgent.value = props.agentCle;
          }
          const sInit = props.statutInitial.toUpperCase();
          for (let opt of selectStatut.options) {
            if (sInit.includes(opt.value)) {
              selectStatut.value = opt.value;
              break;
            }
          }
          modalEl.style.display = 'flex';
        },
        events: []
      });

      calendar.render();

      // Handshake avec requiredAccess: 'full' obligatoire pour le niveau actuel
      grist.ready({ requiredAccess: 'full' });
      chargerAnnuaireDirect();

      grist.onRecords(function(records) {
        if (records) {
          traiterDonnees(records);
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initialiser);
    } else {
      initialiser();
    }
  </script>
</body>
</html>
