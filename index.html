<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales/fr.global.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      height: 100%;
      overflow: hidden;
    }
    #calendar {
      height: 100vh;
      padding: 8px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="calendar"></div>

  <script>
    let calendar;

    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'fr',
        firstDay: 1,
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        buttonText: {
          today: "Aujourd'hui",
          month: 'Mois',
          week: 'Semaine',
          day: 'Jour'
        },
        events: []
      });
      calendar.render();

      grist.ready({ requiredAccess: 'read table' });
      grist.onRecords(function(records) {
        const events = records.map(r => {
          const debut = r.Date_debut || r.date_debut;
          const fin = r.Date_fin || r.date_fin;
          const agent = r.Agent || r.qui || 'Événement';
          
          // Recherche insensible au nom exact de la colonne (Statut, Statut_affiche, STATUT, etc.)
          let statutBrut = r.Statut || r.Statut_affiche || r.Statut_conflit || r.STATUT || '';
          
          // Nettoyage de la chaîne
          let statut = String(statutBrut).trim().toUpperCase();

          // Attribution des couleurs
          let couleur = '#3788d8'; // Bleu par défaut
          if (statut.includes('CONFLIT')) {
            couleur = '#d32f2f'; // Rouge
          } else if (statut.includes('CONGES') || statut.includes('CONGÉS')) {
            couleur = '#e6af00'; // Jaune / Ambre foncé (lisible sur fond clair)
          } else if (statut.includes('TELETRAVAIL') || statut.includes('TÉLÉTRAVAIL')) {
            couleur = '#1976d2'; // Bleu soutenu
          } else if (statut.includes('DEPLACEMENT') || statut.includes('DÉPLACEMENT')) {
            couleur = '#f57c00'; // Orange
          } else if (statut.includes('PRESENT') || statut.includes('PRÉSENT')) {
            couleur = '#388e3c'; // Vert
          }

          return {
            id: r.id,
            title: agent + (statutBrut ? ' - ' + statutBrut : ''),
            start: debut,
            end: fin,
            backgroundColor: couleur,
            borderColor: couleur,
            allDay: true
          };
        });

        calendar.removeAllEvents();
        calendar.addEventSource(events);
      });
    });
  </script>
</body>
</html>
