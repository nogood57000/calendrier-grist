<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Planning DTPJJ de Moselle</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales/fr.global.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      overflow: hidden;
    }

    #barre-legende {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
    }
    .item-legende {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pastille {
      width: 13px;
      height: 13px;
      border-radius: 3px;
      display: inline-block;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
    .pastille-vacances {
      background: #bae6fd;
      border: 1px solid #7dd3fc;
    }
    .pastille-we-ferie {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
    }

    #calendar-container {
      flex: 1;
      min-height: 0;
      padding: 8px;
      box-sizing: border-box;
      position: relative;
    }
    #calendar {
      height: 100%;
    }

    /* MÊME FOND COLORÉ POUR LES WEEK-ENDS ET JOURS FÉRIÉS */
    .fc-day-sat, 
    .fc-day-sun, 
    .jour-chome-ferie {
      background-color: #f1f5f9 !important;
    }

    /* VACANCES SCOLAIRES ZONE B EN FOND */
    .vacances-zone-b-bg {
      background-color: rgba(186, 230, 253, 0.45) !important;
      opacity: 1 !important;
    }

    /* BADGES DES JOURS FÉRIÉS */
    .fc-event-ferie {
      background: #475569 !important;
      border: none !important;
      color: #ffffff !important;
      font-size: 10px !important;
      font-weight: 700 !important;
      padding: 2px 5px !important;
      border-radius: 3px !important;
      cursor: default !important;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2) !important;
    }

    /* BLOCS DES PRÉSENCES DES AGENTS */
    .fc-event-presence {
      white-space: normal !important;
      min-height: 38px !important;
      margin-bottom: 3px !important;
      border-radius: 4px !important;
      border: none !important;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    .fc-event-presence .fc-event-main {
      padding: 2px 5px !important;
      white-space: normal !important;
    }

    .event-card {
      display: flex;
      flex-direction: column;
      gap: 2px;
      line-height: 1.2;
      text-align: left;
    }

    .event-ligne-statut {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.25);
      padding: 1px 4px;
      border-radius: 2px;
      width: fit-content;
    }

    .event-ligne-nom {
      font-size: 11px;
      font-weight: 600;
      word-break: break-word;
    }

    #fenetre-voeu {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }
    .conteneur-formulaire {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }
    .conteneur-formulaire h3 {
      margin: 0 0 14px 0;
      font-size: 15px;
      color: #1e293b;
    }
    .champ {
      margin-bottom: 10px;
    }
    .champ label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #475569;
    }
    .champ input, .champ select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
      background: #ffffff;
    }
    .barre-boutons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
    }
    .groupe-actions-droite {
      display: flex;
      gap: 8px;
    }
    .btn {
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    .btn-gris {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-bleu {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-rouge {
      background: #fee2e2;
      color: #b91c1c;
    }
  </style>
</head>
<body>

    <span class="item-legende"><span class="pastille" style="background:#1976d2;"></span> Télétravail</span>
    <span class="item-legende"><span class="pastille" style="background:#f57c00;"></span> Déplacement</span>
    <span class="item-legende"><span class="pastille
