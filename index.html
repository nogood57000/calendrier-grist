<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Calendrier des présences</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      overflow: hidden;
    }

    #barre-legende {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
    }
    .item-legende {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pastille {
      width: 13px;
      height: 13px;
      border-radius: 3px;
      display: inline-block;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
    .pastille-vacances {
      background: repeating-linear-gradient(
        45deg,
        #e2e8f0,
        #e2e8f0 3px,
        #cbd5e1 3px,
        #cbd5e1 6px
      );
    }

    #calendar-container {
      flex: 1;
      min-height: 0;
      padding: 8px;
      box-sizing: border-box;
      position: relative;
    }
    #calendar {
      height: 100%;
    }

    /* Style des vacances en arrière-plan */
    .fc-bg-event.zone-b-vacances {
      background: rgba(186, 230, 253, 0.45) !important; /* Bleu très doux */
      opacity: 1 !important;
      border: none !important;
    }

    .fc-event, 
    .fc-daygrid-event, 
    .fc-daygrid-block-event {
      white-space: normal !important;
      min-height: 38px !important;
      margin-bottom: 3px !important;
      border-radius: 4px !important;
      border: none !important;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    .fc-event-main {
      padding: 2px 5px !important;
      white-space: normal !important;
    }

    .event-card {
      display: flex;
      flex-direction: column;
      gap: 2px;
      line-height: 1.2;
      text-align: left;
    }

    .event-ligne-statut {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.25);
      padding: 1px 4px;
      border-radius: 2px;
      width: fit-content;
    }

    .event-ligne-nom {
      font-size: 11px;
      font-weight: 600;
      word-break: break-word;
    }

    #fenetre-voeu {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }
    .conteneur-formulaire {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }
    .conteneur-formulaire h3 {
      margin: 0 0 14px 0;
      font-size: 15px;
      color: #1e293b;
    }
    .champ {
      margin-bottom: 10px;
    }
    .champ label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #475569;
    }
    .champ input, .champ select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
      background: #ffffff;
    }
    .barre-boutons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
    }
    .groupe-actions-droite {
      display: flex;
      gap: 8px;
    }
    .btn {
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    .btn-gris {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-bleu {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-rouge {
      background: #fee2e2;
      color: #b91c1c;
    }
  </style>
</head>
<body>

  <div id="barre-legende">
    <span style="font-size: 11px; text-transform: uppercase; color: #64748b; margin-right: 4px;">Légende :</span>
    <span class="item-legende"><span class="pastille" style="background:#fbc02d;"></span> Congés</span>

      <div class="champ">
        <label for="form-debut">Date de début</label>
        <input type="date" id="form-debut" />
      </div>

      <div class="champ">
        <label for="form-fin">Date de fin</label>

      <div class="barre-boutons">

        <div class="groupe-actions-droite">

          <button type="button" class="btn btn-bleu" id="btn-valider">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>

    function parseDate(val) {
      if (!val) return null;
      if (typeof val === 'string') {
        const iso = val.match(/^(\d{4}-\d{2}-\d{2})/);
        if (iso) return iso[1];
        const fr = val.match(/^(\d{2})[-/](\d{2})[-/](\d{4})/);
        if (fr) return `${fr[3]}-${fr[2]}-${fr[1]}`;
      }
      if (typeof val === 'number') {
        const ts = val < 10000000000 ? val * 1000 : val;
        const d = new Date(ts);
        if (!isNaN(d.getTime())) return d.toISOString().split('T')[0];
      }
      return null;
    }

    function addDays(strDate, nb) {
      if (!strDate) return strDate;
      const d = new Date(strDate);
      d.setDate(d.getDate() + nb);
      return d.toISOString().split('T')[0];
    }
